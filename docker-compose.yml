services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-ecommerce
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      ORACLE_DATABASE: ECOMMERCE
      APP_USER: ecommerce
      APP_USER_PASSWORD: ecommerce
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/oracle/init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  oracle-data:
